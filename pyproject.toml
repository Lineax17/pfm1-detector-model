[project]
name = "pfm1-detector-model"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "albumentations>=2.0.8",
    "matplotlib>=3.10.9",
    "opencv-python>=4.13.0.92",
    "torch",
    "torchvision",
    "torchaudio",
    "ultralytics>=8.4.51",
]

# ROCM-specific package index configuration
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.0"

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
torchaudio = { index = "pytorch-rocm" }